[platformio]
default_envs = esp32-c3-devkitm-1-en, esp32-c3-devkitm-1-de, esp32-c3-devkitm-1-ja

[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
build_flags =
    -include src/firmware_build_config.h
    -flto
    ; App/Arduino/NimBLE sources do not use C++ exception handling.
    ; Preserve precompiled SDK tables; only stop generating new unwind data.
    -fno-exceptions
    -fno-unwind-tables
    -fno-asynchronous-unwind-tables
    ; NimBLE's MYNEWT overrides bypass the hard-enabled CONFIG_BT defaults.
    ; Friend requests use advertisements and public GATT reads, not SMP bonds.
    -DMYNEWT_VAL_BLE_SM_LEGACY=0
    -DMYNEWT_VAL_BLE_SM_SC=0
    -DMYNEWT_VAL_BLE_SM_BONDING=0
    -DMYNEWT_VAL_BLE_STORE_CONFIG_PERSIST=0
    ; Friendship exchanges use individual reads/writes, including long values.
    ; Omit unused batch-read, included-service and reliable multi-write paths.
    -DMYNEWT_VAL_BLE_ATT_SVR_READ_MULT=0
    -DMYNEWT_VAL_BLE_ATT_SVR_READ_MULT_VAR=0
    -DMYNEWT_VAL_BLE_GATT_READ_MULT=0
    -DMYNEWT_VAL_BLE_GATT_READ_MULT_VAR=0
    -DMYNEWT_VAL_BLE_GATT_READ_UUID=0
    -DMYNEWT_VAL_BLE_GATT_FIND_INC_SVCS=0
    -DMYNEWT_VAL_BLE_GATT_WRITE_RELIABLE=0
    -DMYNEWT_VAL_BLE_ATT_SVR_NOTIFY_MULTI=0
    -DMYNEWT_VAL_BLE_GATT_NOTIFY_MULTIPLE=0
build_unflags =
    -fno-lto
    -fexceptions
extra_scripts =
    pre:scripts/configure_release.py
    pre:scripts/generate_web_ui.py
    post:scripts/configure_lto.py
    post:scripts/check_firmware_size.py
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.4.2
    h2zero/NimBLE-Arduino@2.5.0

[env:esp32-c3-devkitm-1-en]
custom_ui_language = en

[env:esp32-c3-devkitm-1-de]
custom_ui_language = de

[env:esp32-c3-devkitm-1-ja]
custom_ui_language = ja
