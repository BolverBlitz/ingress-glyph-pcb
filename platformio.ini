[platformio]
default_envs = esp32-c3-devkitm-1-en, esp32-c3-devkitm-1-de, esp32-c3-devkitm-1-ja

[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
build_flags =
    -flto
    ; App/Arduino/NimBLE sources do not use C++ exception handling.
    ; Preserve precompiled SDK tables; only stop generating new unwind data.
    -fno-exceptions
    -fno-unwind-tables
    -fno-asynchronous-unwind-tables
    ; NimBLE's MYNEWT overrides bypass the hard-enabled CONFIG_BT defaults.
    ; Friend requests use advertisements and public GATT reads, not SMP bonds.
    -DMYNEWT_VAL_BLE_SM_LEGACY=0
    -DMYNEWT_VAL_BLE_SM_SC=0
    -DMYNEWT_VAL_BLE_SM_BONDING=0
    -DMYNEWT_VAL_BLE_STORE_CONFIG_PERSIST=0
build_unflags =
    -fno-lto
    -fexceptions
extra_scripts = pre:scripts/generate_web_ui.py, post:scripts/check_firmware_size.py
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.5
    bblanchon/ArduinoJson@^7.4.2
    h2zero/NimBLE-Arduino@2.5.0

[env:esp32-c3-devkitm-1-en]
custom_ui_language = en

[env:esp32-c3-devkitm-1-de]
custom_ui_language = de

[env:esp32-c3-devkitm-1-ja]
custom_ui_language = ja
